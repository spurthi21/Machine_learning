<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>House Price Prediction</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            overflow: hidden;
            color: #fff;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ===== ANIMATION ===== */
        @keyframes floatRotate {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-80px) rotate(360deg); }
        }

        .shape {
            position: absolute;
            opacity: 0.6;
            animation: floatRotate 14s infinite ease-in-out alternate;
        }

        /* ===== SHAPES ===== */
        .crystal {
            width: 90px;
            height: 90px;
            clip-path: polygon(50% 0%, 100% 35%, 75% 100%, 25% 100%, 0% 35%);
        }

        .c1 { top:10%; left:10%; background:linear-gradient(135deg,#3b82f6,#06b6d4);}
        .c2 { top:20%; left:80%; background:linear-gradient(135deg,#22c55e,#4ade80);}
        .c3 { top:70%; left:15%; background:linear-gradient(135deg,#f59e0b,#fbbf24);}
        .c4 { top:60%; left:85%; background:linear-gradient(135deg,#ec4899,#f472b6);}
        .c5 { top:40%; left:50%; background:linear-gradient(135deg,#8b5cf6,#a78bfa);}

        .circle {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: radial-gradient(circle, #38bdf8, transparent);
        }

        .square {
            width: 100px;
            height: 100px;
            border-radius: 15px;
            background: linear-gradient(45deg,#f43f5e,#fb7185);
        }

        .triangle {
            width: 0;
            height: 0;
            border-left: 55px solid transparent;
            border-right: 55px solid transparent;
            border-bottom: 100px solid #10b981;
        }

        .cir1 { top:80%; left:30%; }
        .cir2 { top:25%; left:55%; }

        .sq1 { top:50%; left:20%; }
        .sq2 { top:75%; left:70%; }

        .tri1 { top:30%; left:70%; }
        .tri2 { top:65%; left:45%; }

        /* ===== CARD ===== */
        .container-box {
            width: 100%;
            max-width: 560px;
            padding: 35px;
            border-radius: 16px;
            background: rgba(255,255,255,0.07);
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            z-index: 2;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #ffffff;
            font-weight: 600;
        }

        label {
            font-size: 13px;
            color: #e2e8f0; /* brighter */
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-control {
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 8px;
            color: #ffffff; /* FIX */
            padding: 10px;
            font-size: 14px;
        }

        .form-control::placeholder {
            color: #cbd5f5;
        }

        .form-control:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 10px rgba(59,130,246,0.6);
            background: rgba(255,255,255,0.15);
        }

        select.form-control {
            color: #ffffff;
        }

        option {
            color: #000;
        }

        .btn-custom {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(45deg, #3b82f6, #06b6d4);
            color: #fff;
            font-weight: 500;
        }

        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .results-link {
            text-align: center;
            margin-top: 15px;
        }

        .results-link a {
            color: #93c5fd;
            text-decoration: none;
        }
    </style>
</head>

<body>

<!-- SHAPES -->
<div class="shape crystal c1"></div>
<div class="shape crystal c2"></div>
<div class="shape crystal c3"></div>
<div class="shape crystal c4"></div>
<div class="shape crystal c5"></div>

<div class="shape circle cir1"></div>
<div class="shape circle cir2"></div>

<div class="shape square sq1"></div>
<div class="shape square sq2"></div>

<div class="shape triangle tri1"></div>
<div class="shape triangle tri2"></div>

<!-- FORM -->
<div class="container-box">

    <h2>🏠 House Price Prediction</h2>

    <form action="/predict" method="POST">

        <div class="form-group">
            <label>Average Area Income</label>
            <input type="number" step="any" name="Avg. Area Income" class="form-control" required>
        </div>

        <div class="form-group">
            <label>Average Area House Age</label>
            <input type="number" step="any" name="Avg. Area House Age" class="form-control" required>
        </div>

        <div class="form-group">
            <label>Average Area Number of Rooms</label>
            <input type="number" step="any" name="Avg. Area Number of Rooms" class="form-control" required>
        </div>

        <div class="form-group">
            <label>Average Area Number of Bedrooms</label>
            <input type="number" step="any" name="Avg. Area Number of Bedrooms" class="form-control" required>
        </div>

        <div class="form-group">
            <label>Area Population</label>
            <input type="number" step="any" name="Area Population" class="form-control" required>
        </div>

        <div class="form-group">
            <label>Select Model</label>
            <select name="model" class="form-control" required>
                {% for model_name in model_names %}
                    <option value="{{ model_name }}">{{ model_name }}</option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="btn-custom">
            Predict Price
        </button>

    </form>

    <div class="results-link">
        <a href="/results">📊 View Model Evaluation Results</a>
    </div>

</div>

</body>
</html>
